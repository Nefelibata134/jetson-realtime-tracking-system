name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-22.04
    container:
      image: ubuntu:22.04
    steps:
      - name: Install dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates \
            cmake \
            g++ \
            git \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-plugins-ugly \
            libeigen3-dev \
            nlohmann-json3-dev \
            libopencv-dev \
            make \
            pkg-config \
            python3

      - name: Checkout
        uses: actions/checkout@v5

      - name: Trust checkout directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Configure
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DEDGE_VISION_ENABLE_GSTREAMER=ON

      - name: Build
        run: cmake --build build -j2

      - name: Test
        run: |
          ctest --test-dir build --output-on-failure
          ./build/edge_vision_video_writer_check x264

      - name: Validate shell tools
        run: bash -n scripts/*.sh

      - name: Validate Python tools
        run: python3 -m unittest discover -s tests -p 'test_*.py'

      - name: Validate release contract
        run: python3 scripts/validate_release.py
